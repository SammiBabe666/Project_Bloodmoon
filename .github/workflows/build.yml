name: Build BLOODMOON plugin

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find the kit folders
        id: find-kit
        shell: bash
        run: |
          MP=$(find . -name make_plugin.py -not -path './.git/*' -print -quit)
          DF=$(find . -name Dockerfile -not -path './.git/*' -print -quit)

          echo "Found make_plugin.py at: [$MP]"
          echo "Found Dockerfile at: [$DF]"

          if [[ -z "$MP" || -z "$DF" ]]; then
            echo "ERROR: the synth_sdk and toolchain folders were not uploaded to this repository."
            exit 1
          fi

          SDK_DIR=$(dirname "$MP")
          TC_DIR=$(dirname "$DF")

          echo "SDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk=$SDK_DIR" >> "$GITHUB_OUTPUT"
          echo "tc=$TC_DIR" >> "$GITHUB_OUTPUT"

      - name: Install the packaging helper
        run: python -m pip install pyelftools

      - name: PC sound test
        run: cd "$SDK" && python3 harness/audio.py bloodmoon

      - uses: docker/setup-buildx-action@v3

      - name: Build the Blackfin compiler
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.find-kit.outputs.tc }}
          tags: bfin-elf-toolchain
          load: true
          cache-from: type=gha,scope=blackfin-toolchain
          cache-to: type=gha,scope=blackfin-toolchain,mode=max

      - name: Build the plugin file
        run: cd "$SDK" && python3 make_plugin.py plugins/bloodmoon && ls -l build/plugins

      - name: Save the plugin as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodmoon-op1p
          path: ${{ steps.find-kit.outputs.sdk }}/build/plugins/bloodmoon.op1p
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.ref_name }}
          name: BLOODMOON ${{ inputs.tag_name }}
          generate_release_notes: true
          draft: false
          files: ${{ steps.find-kit.outputs.sdk }}/build/plugins/bloodmoon.op1p
          fail_on_unmatched_files: true
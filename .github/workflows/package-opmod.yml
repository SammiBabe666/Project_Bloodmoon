name: One-time build of bloodmoon.opmod for the download

# Temporary: builds bloodmoon.opmod once and commits it to this branch as download/bloodmoon.opmod, so the repository
# can ship the file ready-made. Removed again in the same pull request.
on:
  push:
    branches: [ready-download]
    paths: ['.github/workflows/package-opmod.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LizardMan245/opus
          ref: d9b0d2e6ddf660d7db758f2be9647585fe100ad8
          path: opus-kit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Computer test against v1.3
        run: OPUS_SDK=opus-kit/plugin-kit/sdk OUT=$RUNNER_TEMP/test opus/tests/run.sh
      - name: Build the Blackfin compiler
        run: |
          sudo bash opus-kit/plugin-kit/tools/toolchain/build-bfin-toolchain.sh deps
          WORK=/home/runner/bfin-build bash opus-kit/plugin-kit/tools/toolchain/build-bfin-toolchain.sh fetch verify extract linux
      - name: Build bloodmoon.opmod and commit it
        run: |
          export OP1_BFIN_TOOLCHAIN=/home/runner/bfin-build/linux-install
          mkdir -p download
          python opus-kit/plugin-kit/plugin_tool.py build opus/noladrift.bloodmoon --out download/bloodmoon.opmod
          python opus-kit/plugin-kit/plugin_tool.py show download/bloodmoon.opmod
          rm -rf download/bloodmoon.build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/bloodmoon.opmod
          git commit -m "Add the built bloodmoon.opmod (one-time build)"
          git push
